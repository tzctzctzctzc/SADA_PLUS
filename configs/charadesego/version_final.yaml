init_rand_seed: 123
dataset_name: charadesego
src_train_split: ["third_training"]
src_val_split: ["third_validation"]
tgt_train_split: ["ego_training"]
tgt_val_split: ["ego_validation"]
model_name: "sada"
dataset: {
  anno_path: ./data/CharadesEgo_v1_processed/annotations,
  mapping_path: ./data/CharadesEgo_v1_processed/annotations,
  feat_path: ./data/CharadesEgo_v1_processed/features,
  num_classes: 10,
  input_dim: 1024,
  feat_stride: 8,
  num_frames: 32,
  default_fps: 24,
  trunc_thresh: 0.3,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 2304,
}
model: {
  # Default options from the original model
  backbone_type: SGP,
  backbone_arch: [2, 2, 5],
  scale_factor: 2,
  embd_kernel_size: 3,
  embd_dim: 256,
  embd_with_ln: True,
  fpn_dim: 256,
  fpn_with_ln: True,
  head_dim: 256,
  head_kernel_size: 3,
  boudary_kernel_size: 3,
  head_num_layers: 3,
  head_with_ln: True,
  use_abs_pe: True,
  use_trident_head: False,
  downsample_type: "max",
  k: 1.5,
  init_conv_vars: 0,
  input_noise: 0,
  weight_sharing: True,

  # Specifically overriden options
  regression_range: [[0, 4], [2, 8], [4, 16], [8, 32], [16, 64], [32, 10000]],
  fpn_type: identity,
  max_buffer_len_factor: 4.0,
  n_sgp_win_size: 5,
  num_bins: 16,
  iou_weight_power: 0.25,
  sgp_mlp_dim: 1024,
  k: 2,

  # Other model-specific configurations ()
  loss_weights: {
    weight_reg: 1.0,  # on reg_loss, use -1 to enable auto balancing
    weight_adv: 1.0,
    weight_semantic: 0.0,
    weight_downstream: 2.0,
    weight_adv_gamma: 10.0
  },
  
  # cls head without data (a fix to epic-kitchens / thumos)
  head_empty_cls: [],
  # dropout ratios for tranformers
  dropout: 0.25,
  # ratio for drop path
  droppath: 0.25,
  # if to use label smoothing (>0.0)
  label_smoothing: 0.0,

  # gradient cliping, not needed for pre-LN transformer
  init_loss_norm: 250,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,

  # Other new options
  use_rev_grad: True,
  weight_clip_value: 0.5,
  adv_method: [conditional_rev],   # False uses the wgan-like paradigm
  semantic_alignment: False,
  da_ema_momentum: 0.7,
  use_pseudo_labels: True,
  num_discriminator_updates: 2,
  num_alternation_steps_sl: 8,
  pl_threshold: 0.6,
  use_static_anchors: False,
  use_static_threshold: True,
  incremental_align: False,
  use_level_disc: True,
  src_regularization: label_smoothing,
  use_adv_discriminator: True,
  align_final_embs: False,
  
  semantic_alignment_levels: [0,1,2,3,4,5],
  semantic_alignment_projection_depth: 0,
  semantic_alignment_all_lvls_together: False,
  semantic_align_loss: "mse",

  focal_loss_gamma: 2.0,

  filter_fp: "all",
  filter_reg: False,
  filter_reg_iou: 0.0,
  perc_static_anchors: 0.6,
  pseudo_labeling_strategy: "hard_pseudolabeling",
  use_argmax_strategy: True,
  align_bkg: True,


  # New options for the adversarial training
  num_conditional_adv_layers: 2,
  conditional_adv_activation: "leaky_relu",
  conditional_adv_bias: 0.25,
  conditional_adv_drop_rate: 0.5,
  dim_proj_adv: 512,
  beta: 0.5,
  weight_source_cond_adv: 1.0,
  weight_target_cond_adv: 0.2,
  weight_no_class_adv: 0.3,
  weight_level_0: 0.4,
  weight_level_1: 0.8,
  weight_level_2: 0.7,
  weight_level_3: 0.7,
  weight_level_4: 0.9,
  weight_level_5: 0.6,
}
opt: {
  type: "AdamW",  # SGD or AdamW
  momentum: 0.9,
  warmup: True,
  schedule_type: "cosine",
  schedule_steps: [2], #[2,4,6,8,10],
  schedule_gamma: 0.1,

  learning_rate: 0.0001,
  disc_learning_rate: 0.007,
  eta_min: 0.00001,
  warmup_epochs: 4,
  epochs: 50,
  weight_decay: 0.05,

}
loader: {
  batch_size: 2, #4,
  num_workers: 4
}
train_cfg: {  
  clip_grad_l2norm: 1.0,

  ema_active: True,
  ema_decay: 0.999,
  step_start_ema: 0,
  update_ema_every: 1,

  save_period: 5,
  verbosity: 1,
  monitor: "min val_loss",
  early_stop: -1,
  valid_freq: 2, #3,
  test_freq: 2, #3,

  train_vis_idces: [0, 1, 2],
  test_vis_idces: [0, 1, 2]
}
test_cfg: {
  pre_nms_thresh: 0.001,
  iou_threshold: 0.1,
  nms_method: 'soft',  # soft | hard | none
  duration_thresh: 0.05,
  ext_score_file: None,
  voting_thresh: 0.75,

  pre_nms_topk: 5000,
  max_seg_num: 2000,
  min_score: 0.001,
  nms_sigma : 0.4,
  multiclass_nms: True
}
